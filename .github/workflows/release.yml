name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # For creating GitHub Releases
  packages: write      # For pushing Docker images to ghcr.io
  issues: write        # For closing milestone issues
  id-token: write      # For Cosign signing with GitHub OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # CRITICAL: Required for GoReleaser to work properly

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        # Required for multi-platform container builds

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to v2.15.4: newer GoReleaser hard-errors on the deprecated `brews`
      # config. v2.15.4 still emits the cross-platform Homebrew formula. Revisit
      # when migrating off `brews` (note: homebrew_casks is macOS-only).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.15.4'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
